[package]
name = "polykrom-engine"
description = "Polykrom engine: the session, the command registry (everything is a command), undo/redo and selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Turns on the parameter-contract audit recorder (`SOLIDCRAFT_PARAM_AUDIT`, see
# `src/schema/record.rs`), for checking a new contract against the whole test suite.
param-audit = []
solver-profiling = ["polykrom-sketch/solver-profiling"]

[[example]]
name = "sketch_analysis_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_drag_bench"
required-features = ["solver-profiling"]

[[example]]
name = "sketch_target_bench"
required-features = ["solver-profiling"]

[dependencies]
polycore-geom = { workspace = true }
polykrom-sketch = { workspace = true }
polycore = { workspace = true }
polykrom-doc = { workspace = true }
polykrom-io = { workspace = true }
polykrom-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
# Normal CI exercises profiling assertions without enabling the production feature.
polykrom-sketch = { workspace = true, features = ["solver-profiling"] }
