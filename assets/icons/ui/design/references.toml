# Finished visual references, not a list that controls discovery or review status.
[category.model]
label = "Features and solids"
rule = "A part from frame() in 2:1 dimetric line art; the face the command makes is the one facet; one action arrow."
icons = ["extrude", "fillet", "shell", "hole"]
[category.construct]
label = "Construction"
rule = "Defining geometry in ink; the plane (pale facet, accent edge), axis (accent line, end dots) or point (accent ring) is the result."
icons = ["plane_midplane", "axis_two_planes", "point_vertex"]
[category.sketch]
label = "Sketch and constraints"
rule = "Flat geometry as a bold accent stroke with ringed points; constraints draw the related geometry in ink and the relation in the accent."
icons = ["rect", "circle3", "slot", "sketch_fillet", "c_parallel", "c_tangent"]
[category.utility]
label = "Documents and utilities"
rule = "A compact object outlined at action weight with one facet."
icons = ["new", "copy", "delete", "export"]
[category.flat]
label = "Application bar and navigation"
rule = "currentColor outlines at action weight; a facet only where it names the thing."
icons = ["save", "orbit", "settings"]
[category.workspace]
label = "Workspace marks"
rule = "One large, simple mark."
icons = ["ws_design", "ws_render"]
