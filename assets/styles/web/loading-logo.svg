<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
  <title id="t">Polykrom</title>
  <desc id="d">Polykrom's mark, a lowercase p in whole pixels in lime, assembles cell by cell, and the name settles underneath.</desc>
  <style>
    rect { fill: #CCFF00; animation: cell 420ms cubic-bezier(.2,.9,.3,1.2) both; transform-box: fill-box; transform-origin: center; }
    text { fill: #EFEAE2; font: 560 34px "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; animation: name 600ms ease-out 900ms both; }
    @keyframes cell { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    @keyframes name { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { rect, text { animation: none; } }
  </style>
  <g>
    <rect x="90" y="24" width="30" height="30" style="animation-delay:0ms"/>
    <rect x="120" y="24" width="30" height="30" style="animation-delay:70ms"/>
    <rect x="150" y="24" width="30" height="30" style="animation-delay:140ms"/>
    <rect x="180" y="24" width="30" height="30" style="animation-delay:210ms"/>
    <rect x="210" y="24" width="30" height="30" style="animation-delay:280ms"/>
    <rect x="90" y="54" width="30" height="30" style="animation-delay:70ms"/>
    <rect x="120" y="54" width="30" height="30" style="animation-delay:140ms"/>
    <rect x="210" y="54" width="30" height="30" style="animation-delay:350ms"/>
    <rect x="240" y="54" width="30" height="30" style="animation-delay:420ms"/>
    <rect x="90" y="84" width="30" height="30" style="animation-delay:140ms"/>
    <rect x="120" y="84" width="30" height="30" style="animation-delay:210ms"/>
    <rect x="210" y="84" width="30" height="30" style="animation-delay:420ms"/>
    <rect x="240" y="84" width="30" height="30" style="animation-delay:490ms"/>
    <rect x="90" y="114" width="30" height="30" style="animation-delay:210ms"/>
    <rect x="120" y="114" width="30" height="30" style="animation-delay:280ms"/>
    <rect x="150" y="114" width="30" height="30" style="animation-delay:350ms"/>
    <rect x="180" y="114" width="30" height="30" style="animation-delay:420ms"/>
    <rect x="210" y="114" width="30" height="30" style="animation-delay:490ms"/>
    <rect x="90" y="144" width="30" height="30" style="animation-delay:280ms"/>
    <rect x="120" y="144" width="30" height="30" style="animation-delay:350ms"/>
    <rect x="90" y="174" width="30" height="30" style="animation-delay:350ms"/>
    <rect x="120" y="174" width="30" height="30" style="animation-delay:420ms"/>
  </g>
  <text x="180" y="276" text-anchor="middle">polykrom</text>
</svg>
