<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 24 912 1060" width="456" height="530" role="img" aria-labelledby="t d">
  <title id="t">Polykrom</title>
  <desc id="d">The Polykrom gem assembles: six dark corner facets, three mid facets and the light centre each grow into place, then the seams between them open and the name settles underneath.</desc>
  <defs>
    <mask id="seams" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1100">
      <rect width="1024" height="1100" fill="#fff"/>
      <g class="seam" stroke="#000" stroke-width="18" stroke-linecap="round">
        <line x1="512.0" y1="285.0" x2="702.5" y2="615.0"/>
        <line x1="702.5" y1="615.0" x2="321.5" y2="615.0"/>
        <line x1="321.5" y1="615.0" x2="512.0" y2="285.0"/>
        <line x1="893.1" y1="285.0" x2="512.0" y2="285.0"/>
        <line x1="893.1" y1="285.0" x2="702.5" y2="615.0"/>
        <line x1="512.0" y1="945.0" x2="702.5" y2="615.0"/>
        <line x1="512.0" y1="945.0" x2="321.5" y2="615.0"/>
        <line x1="130.9" y1="285.0" x2="321.5" y2="615.0"/>
        <line x1="130.9" y1="285.0" x2="512.0" y2="285.0"/>
        <line x1="512.0" y1="65.0" x2="512.0" y2="285.0"/>
        <line x1="893.1" y1="725.0" x2="702.5" y2="615.0"/>
        <line x1="130.9" y1="725.0" x2="321.5" y2="615.0"/>
      </g>
    </mask>
  </defs>
  <style>
    :root { --word: #3a3fae; }
    .word { font: 700 64px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--word); letter-spacing: .02em; }
    /* base styles are the finished logo, so reduced-motion shows it whole */
    polygon { transform-box: view-box; }
    .all  { animation: all 5.4s linear infinite; }
    .seam { animation: seam 5.4s ease-in-out infinite; }
    .name { animation: name 5.4s ease-out infinite; }
    @keyframes all  { 0% { opacity: 0; } 2%, 96% { opacity: 1; } 99.5%, 100% { opacity: 0; } }
    @keyframes seam { 0%, 52% { stroke-width: 0; } 59%, 100% { stroke-width: 18; } }
    @keyframes name { 0%, 50% { opacity: 0; } 59%, 100% { opacity: 1; } }
    .f0 { transform-origin: 639px 212px; animation: f0 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f0 { 0%, 4% { opacity: 0; transform: scale(.4); } 11%, 100% { opacity: 1; transform: scale(1); } }
    .f1 { transform-origin: 830px 542px; animation: f1 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f1 { 0%, 9% { opacity: 0; transform: scale(.4); } 16%, 100% { opacity: 1; transform: scale(1); } }
    .f2 { transform-origin: 703px 762px; animation: f2 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f2 { 0%, 14% { opacity: 0; transform: scale(.4); } 21%, 100% { opacity: 1; transform: scale(1); } }
    .f3 { transform-origin: 321px 762px; animation: f3 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f3 { 0%, 19% { opacity: 0; transform: scale(.4); } 26%, 100% { opacity: 1; transform: scale(1); } }
    .f4 { transform-origin: 194px 542px; animation: f4 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f4 { 0%, 24% { opacity: 0; transform: scale(.4); } 31%, 100% { opacity: 1; transform: scale(1); } }
    .f5 { transform-origin: 385px 212px; animation: f5 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f5 { 0%, 29% { opacity: 0; transform: scale(.4); } 36%, 100% { opacity: 1; transform: scale(1); } }
    .f6 { transform-origin: 703px 395px; animation: f6 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f6 { 0%, 34% { opacity: 0; transform: scale(.4); } 41%, 100% { opacity: 1; transform: scale(1); } }
    .f7 { transform-origin: 512px 725px; animation: f7 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f7 { 0%, 39% { opacity: 0; transform: scale(.4); } 46%, 100% { opacity: 1; transform: scale(1); } }
    .f8 { transform-origin: 321px 395px; animation: f8 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f8 { 0%, 44% { opacity: 0; transform: scale(.4); } 51%, 100% { opacity: 1; transform: scale(1); } }
    .f9 { transform-origin: 512px 505px; animation: f9 5.4s cubic-bezier(.3,1.3,.5,1) infinite; }
    @keyframes f9 { 0%, 49% { opacity: 0; transform: scale(.4); } 56%, 100% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .all, .seam, .name, polygon { animation: none; } }
  </style>
  <g class="all">
    <g mask="url(#seams)">
      <polygon class="f0" points="512.0,65.0 893.1,285.0 512.0,285.0" fill="#4146c2"/>
      <polygon class="f1" points="893.1,285.0 893.1,725.0 702.5,615.0" fill="#1a8fab"/>
      <polygon class="f2" points="893.1,725.0 512.0,945.0 702.5,615.0" fill="#13748c"/>
      <polygon class="f3" points="512.0,945.0 130.9,725.0 321.5,615.0" fill="#5e36a8"/>
      <polygon class="f4" points="130.9,725.0 130.9,285.0 321.5,615.0" fill="#7442c4"/>
      <polygon class="f5" points="130.9,285.0 512.0,65.0 512.0,285.0" fill="#353aa6"/>
      <polygon class="f6" points="512.0,285.0 702.5,615.0 893.1,285.0" fill="#2ec4d6"/>
      <polygon class="f7" points="702.5,615.0 321.5,615.0 512.0,945.0" fill="#5a6ee8"/>
      <polygon class="f8" points="321.5,615.0 512.0,285.0 130.9,285.0" fill="#8b62ea"/>
      <polygon class="f9" points="512.0,285.0 702.5,615.0 321.5,615.0" fill="#c9f6fa"/>
    </g>
    <text class="word name" x="512" y="1058" text-anchor="middle">Polykrom</text>
  </g>
</svg>
