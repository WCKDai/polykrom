<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="22" font-weight="500" letter-spacing="0em"><tspan x="584" y="742.5">Colour with a job</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="584" y="782.818">Lime identifies selections, active tools and proposed </tspan><tspan x="584" y="804.818">changes. The supplied gradient belongs to the logo and </tspan><tspan x="584" y="826.818">brand moments.</tspan></text>
<rect width="480" height="260" transform="translate(1064 697)" fill="#292C2F"/>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="22" font-weight="500" letter-spacing="0em"><tspan x="1088" y="742.5">Trust the model</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="1088" y="782.818">Parameters, features and history stay visible. AI acts </tspan><tspan x="1088" y="804.818">through the model&#x2019;s commands, with previews and </tspan><tspan x="1088" y="826.818">Undo.</tspan></text>
</g>
