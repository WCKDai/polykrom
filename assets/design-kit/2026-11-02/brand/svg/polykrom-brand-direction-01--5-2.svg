<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="80" y="782.818">The same graphite surfaces, typography and icon </tspan><tspan x="80" y="804.818">discipline as Trigon. Mechanical CAD gets its own </tspan><tspan x="80" y="826.818">structure and lime accent.</tspan></text>
