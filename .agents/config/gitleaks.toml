# gitleaks configuration for the eng baseline. Extends the maintained default
# ruleset; allowlists are path-scoped and must be justified in review.
title = "eng baseline"
[extend]
useDefault = true

# Test fixtures deliberately contain fake credentials. They are never real.
[[allowlists]]
description = "eng control fixtures"
paths = [
  '''(^|/)tests/fixtures/.*''',
  '''(^|/)tests/test_eng.py''',
  '''(^|/)evals/fixtures/.*''',
  '''(^|/)evals/control-fixture/.*''',
  '''(^|/)evals/agent/fixture/.*''',
]

# Polykrom unit tests use fixed token-shaped strings for localhost control-server and
# WebSocket tests. These exact values are not credentials and appear only in test code.
[[allowlists]]
description = "fixed test tokens (Polykrom control-server and WebSocket tests)"
regexes = [
  '''0123456789abcdef0123456789abcdef''',
  '''0123456789abcdef''',
  '''fedcba9876543210''',
  '''c29saWRjcmFmdC10ZXN0IQ==''',
]

# Polykrom design kit (PK-70): Figma file keys and variable/style keys are identifiers, not
# credentials. Owner accepted them in the public repo on 2026-11-03. Only these exact single-line
# JSON shapes are allowed; any other secret-shaped value is still reported. (No `paths` with
# condition AND: in gitleaks 8.30.1 that suppressed every finding under the path.)
[[allowlists]]
description = "Figma identifiers in the design kit (owner-approved, PK-70)"
regexTarget = "line"
regexes = [
  '''^\s*"(fileKey|sourceFileKey)": "[A-Za-z0-9]{22}",?$''',
  '''^\s*"key": "[0-9a-f]{40}",?$''',
]
