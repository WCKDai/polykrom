[package]
name = "polykrom-cli"
description = "Polykrom headless CLI: run command scripts, measure, export, render snapshots, replay oracle recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "polykrom-cli"

[lints]
workspace = true

[[bin]]
name = "polykrom-cli"
path = "src/main.rs"

[dependencies]
polykrom-engine = { workspace = true }
polykrom-gpu = { workspace = true }
polykrom-mcp = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Snapshot tests decode the pictures to compare them with a tolerance.
image = { workspace = true }
