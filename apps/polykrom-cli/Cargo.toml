[package]
name = "polykrom-cli"
description = "Polykrom headless CLI: run command scripts, measure, export, render snapshots, replay oracle recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "polykrom-cli"

[lints]
workspace = true

[[bin]]
name = "polykrom-cli"
path = "src/main.rs"

# SolidCraft's name for the CLI, kept so scripts and MCP registrations (`solidcraft-cli mcp`)
# keep working: it runs polykrom-cli (docs/compatibility.md).
[[bin]]
name = "solidcraft-cli"
path = "src/solidcraft.rs"

# Compatibility alias for the CLI's first name: forwards to polykrom-cli with a deprecation
# note on stderr.
[[bin]]
name = "solvecraft-cli"
path = "src/alias.rs"

[dependencies]
polykrom-engine = { workspace = true }
polykrom-gpu = { workspace = true }
polykrom-mcp = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Snapshot tests decode the pictures to compare them with a tolerance.
image = { workspace = true }
