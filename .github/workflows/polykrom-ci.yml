# Polykrom's checks. The inherited ci.yml targets SolidCraft's Blacksmith runners, which this
# repository does not have (its jobs never start here), so this workflow runs the same gate as
# `cargo xtask ci` in three test parts. It runs only in WCKDai/polykrom.
#
# Pushes to main run the checks and tests on alpha, the organisation's trusted self-hosted runner
# (16 cores; runner group `trusted`, which allows this file only at refs/heads/main). Pull requests
# never do: their code is untrusted, so they run on GitHub-hosted runners. On alpha the build folder
# persists outside the checkout ($HOME/ci-target/polykrom), so main builds start warm; the system
# packages the tests need (software Vulkan) are installed there once.
name: Polykrom CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polykrom-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  polycore-pin:
    name: PolyCore pin
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned PolyCore revision has green kernel CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rev="$(sed -n 's|.*WCKDai/polycore", rev = "\([0-9a-f]\{7,40\}\)".*|\1|p' Cargo.toml | head -1)"
          [ -n "$rev" ] || { echo "::error::no PolyCore pin in Cargo.toml"; exit 1; }
          echo "pinned PolyCore revision: $rev"
          ok="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/WCKDai/polycore/commits/$rev/check-runs" \
            | jq '[.check_runs[] | select(.conclusion == "success") | select(.name | startswith("Rust / wasm"))] | length')"
          echo "successful PolyCore CI checks for that revision: $ok"
          [ "$ok" -ge 1 ] || { echo "::error::the pinned revision has no successful kernel CI"; exit 1; }

  checks:
    name: Format, repository checks, Clippy, wasm
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","linux","x64","rust-16","trusted"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    # The R2 compile cache (sccache), as PolyCore's CI uses it: on alpha and on GitHub-hosted
    # runners alike. A fork's pull request has no secrets, so it compiles without the cache rather
    # than failing at sccache startup.
    env:
      R2_READY: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' }}
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0
      SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: ${{ vars.SCCACHE_S3_USE_SSL }}
      SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Persistent build folder (alpha)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/polykrom" >> "$GITHUB_ENV"
      - name: Install sccache
        if: env.R2_READY == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: checks
      - name: Format
        run: cargo fmt --all --check
      - name: Asset attribution
        run: cargo xtask assets
      - name: UI icon standards
        run: cargo xtask icons
      - name: Sorted lists
        run: cargo xtask lists
      - name: Dependency layers
        run: cargo xtask layers
      - name: Universal UI containers
        run: cargo xtask ui-containers
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: WebAssembly check
        run: cargo xtask wasm
      - name: Compile cache statistics
        if: always() && env.R2_READY == 'true'
        run: sccache --show-stats

  tests:
    name: Tests (${{ matrix.part }})
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","linux","x64","rust-16","trusted"]') || 'ubuntu-24.04' }}
    timeout-minutes: 300
    # The R2 compile cache (sccache), as PolyCore's CI uses it: on alpha and on GitHub-hosted
    # runners alike. A fork's pull request has no secrets, so it compiles without the cache rather
    # than failing at sccache startup.
    env:
      R2_READY: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' }}
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0
      SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: ${{ vars.SCCACHE_S3_USE_SSL }}
      SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The kernel lives in PolyCore and is tested there at the revision pinned in Cargo.toml.
          - part: engine
            args: -p polykrom-engine --lib
          - part: ui
            args: -p polykrom-ui-egui
          - part: rest
            args: --workspace --exclude polykrom-engine --exclude polykrom-ui-egui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Persistent build folder (alpha)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/polykrom" >> "$GITHUB_ENV"
      - name: Install sccache
        if: env.R2_READY == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: tests-${{ matrix.part }}
      # Installed once on alpha, where the runner has no sudo.
      - name: Software Vulkan for the GPU tests
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28 (upstream's pin)
        with:
          tool: cargo-nextest
      # The gate's own profile (cargo xtask ci), run by nextest as upstream's CI runs it: pull requests
      # skip the heavy tests (default-filter in .config/nextest.toml) but still run the robustness
      # goldens, all but the slowest seeds; pushes to main run every test.
      - name: Test
        env:
          EVENT_NAME: ${{ github.event_name }}
          SLOW_SEEDS: 81|45|20|24|95|02|57|40|18|48|32|46|85|61|77|34|14
        run: |
          base='all()'
          if [ "$EVENT_NAME" = pull_request ]; then
            base="default() | (package(polykrom-engine) & test(/^tests::robustness_goldens::/) & not test(/^tests::robustness_goldens::seed_($SLOW_SEEDS)\$/))"
          fi
          cargo nextest run --locked --cargo-profile ci --profile ci --no-tests=pass --ignore-default-filter -E "$base" ${{ matrix.args }}
      # nextest does not run doc tests: the rest part runs them.
      - name: Doc tests
        if: matrix.part == 'rest'
        run: cargo test --locked --profile ci --doc --workspace
      - name: Compile cache statistics
        if: always() && env.R2_READY == 'true'
        run: sccache --show-stats

  site:
    name: Site viewer tests
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hashFiles is not available in a job's `if`: the steps skip when the site is not in the tree.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: hashFiles('site/tests/viewer_test.ts') != ''
        with:
          deno-version: v2.x
      - name: Viewer kinematics and mesh packs
        if: hashFiles('site/tests/viewer_test.ts') != ''
        run: |
          fixture="$RUNNER_TEMP/viewer-fixture"
          python3 site/tests/fixture.py "$fixture"
          python3 site/meshpack.py "$fixture" "$fixture/pack.bin" "$fixture/pack.json"
          FIXTURE="$fixture" deno test -A --import-map=site/tests/import_map.json site/tests/viewer_test.ts
