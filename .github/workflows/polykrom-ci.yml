# Polykrom's checks. The inherited ci.yml targets SolidCraft's Blacksmith runners, which this
# repository does not have (its jobs never start here), so this workflow runs the same gate as
# `cargo xtask ci`. The tests are scripts/ci/nextest.sh's: pull requests run them in parallel parts,
# main in one run. It runs only in WCKDai/polykrom.
#
# Pushes to main run the checks and tests on alpha, the organisation's trusted self-hosted runner
# (16 cores; runner group `trusted`, which allows this file only at refs/heads/main). Pull requests
# never do: their code is untrusted, so they run on GitHub-hosted runners. On alpha the build folder
# persists outside the checkout ($HOME/ci-target/polykrom), so main builds start warm; the system
# packages the tests need (software Vulkan) are installed there once.
#
# No job holds a secret: pull request code could read any secret its run can see, and a shared
# compile cache it could write to would reach main's builds. Pull requests restore main's build
# cache through GitHub's cache, which they can read but not write (see warm-cache).
name: Polykrom CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polykrom-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  polycore-pin:
    name: PolyCore pin
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned PolyCore revision has green kernel CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rev="$(sed -n 's|.*WCKDai/polycore", rev = "\([0-9a-f]\{7,40\}\)".*|\1|p' Cargo.toml | head -1)"
          [ -n "$rev" ] || { echo "::error::no PolyCore pin in Cargo.toml"; exit 1; }
          echo "pinned PolyCore revision: $rev"
          ok="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/WCKDai/polycore/commits/$rev/check-runs" \
            | jq '[.check_runs[] | select(.conclusion == "success") | select(.name | startswith("Rust / wasm"))] | length')"
          echo "successful PolyCore CI checks for that revision: $ok"
          [ "$ok" -ge 1 ] || { echo "::error::the pinned revision has no successful kernel CI"; exit 1; }

  checks:
    name: Format, repository checks, Clippy, wasm
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["self-hosted","linux","x64","rust-16","trusted"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Persistent build folder (alpha)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/polykrom" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Asset attribution
        run: cargo xtask assets
      - name: UI icon standards
        run: cargo xtask icons
      - name: Sorted lists
        run: cargo xtask lists
      - name: Affected-package selector
        run: python3 -I scripts/ci/test_affected.py
      - name: Dependency layers
        run: cargo xtask layers
      - name: Universal UI containers
        run: cargo xtask ui-containers
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: WebAssembly check
        run: cargo xtask wasm

  # What a pull request's change can affect (scripts/ci/affected.py): the test jobs narrow to those
  # packages. Every test job still runs and reports, so required checks never wait on a skipped one.
  changes:
    name: Affected packages
    if: github.repository == 'WCKDai/polykrom' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.affected.outputs.full }}
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths"
          python3 -I scripts/ci/affected.py --paths "$RUNNER_TEMP/paths" --github-output "$GITHUB_OUTPUT"

  # Pull requests (and runs by hand): the tests split over GitHub-hosted runners, which are free
  # for a public repository but have 4 cores each, so the parts run side by side. The test set is
  # scripts/ci/nextest.sh's; `--partition` splits a part, and the parts together are its `all`.
  # The action matrix sample takes every core for minutes, so it has a runner of its own.
  tests:
    name: Tests (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && github.repository == 'WCKDai/polykrom' && github.event_name != 'push' && needs.changes.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine 1/4, part: engine, partition: count:1/4 }
          - { name: engine 2/4, part: engine, partition: count:2/4 }
          - { name: engine 3/4, part: engine, partition: count:3/4 }
          - { name: engine 4/4, part: engine, partition: count:4/4 }
          - { name: ui 1/2, part: ui, partition: count:1/2 }
          - { name: ui 2/2, part: ui, partition: count:2/2 }
          - { name: rest 1/2, part: rest, partition: count:1/2 }
          - { name: rest 2/2, part: rest, partition: count:2/2 }
          - { name: action matrix, part: action-matrix, partition: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-${{ matrix.part == 'action-matrix' && 'rest' || matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Software Vulkan for the GPU tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28 (upstream's pin)
        with:
          tool: cargo-nextest
      # Pull requests run the `pr` set (heavy tests and the slowest goldens left to main); a run by
      # hand runs every test.
      - name: Test
        env:
          SET: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          PART: ${{ matrix.part }}
          PARTITION: ${{ matrix.partition }}
          AFFECTED_FULL: ${{ needs.changes.outputs.full || 'true' }}
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: scripts/ci/nextest.sh "$SET" "$PART" ${PARTITION:+--partition "$PARTITION"}

  # nextest does not run doc tests.
  doc-tests:
    name: Doc tests
    needs: changes
    if: ${{ !cancelled() && github.repository == 'WCKDai/polykrom' && github.event_name != 'push' && needs.changes.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: doc-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Software Vulkan for the GPU tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Doc tests
        env:
          AFFECTED_FULL: ${{ needs.changes.outputs.full || 'true' }}
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          scope=(--workspace)
          if [ "$AFFECTED_FULL" != true ]; then
            scope=(); for p in $AFFECTED_PACKAGES; do scope+=(-p "$p"); done
            if [ ${#scope[@]} -eq 0 ]; then echo "this change affects no package; no doc tests to run"; exit 0; fi
          fi
          cargo test --locked --profile ci --doc "${scope[@]}"

  # Pushes to main: every test, in one nextest run on alpha (16 cores), so the workspace builds once
  # and every core stays busy until the end. The build folder persists between runs.
  tests-main:
    name: Tests (main)
    if: github.repository == 'WCKDai/polykrom' && github.event_name == 'push'
    runs-on: ["self-hosted", "linux", "x64", "rust-16", "trusted"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Persistent build folder (alpha)
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/polykrom" >> "$GITHUB_ENV"
      # Software Vulkan is installed on alpha once (the runner has no sudo).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28 (upstream's pin)
        with:
          tool: cargo-nextest
      - name: Test
        run: scripts/ci/nextest.sh main all
      - name: Doc tests
        run: cargo test --locked --profile ci --doc --workspace

  # No job here holds a secret. Pull requests run on GitHub-hosted runners and restore their build
  # cache from main's: GitHub's cache is scoped per branch, so a pull request can read main's entries
  # but only write its own, and nothing a pull request builds reaches main or alpha. Main's checks and
  # tests run on alpha, so after each push to main this job builds the same things on a GitHub-hosted
  # runner and saves them under the keys the pull request jobs restore.
  warm-cache:
    name: Build cache (${{ matrix.key }})
    if: github.repository == 'WCKDai/polykrom' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: checks, run: "cargo clippy --workspace --all-targets --locked -- -D warnings && cargo xtask wasm" }
          - { key: tests-engine, run: "cargo test --no-run --locked --profile ci -p polykrom-engine --lib" }
          - { key: tests-ui, run: "cargo test --no-run --locked --profile ci -p polykrom-ui-egui" }
          - { key: tests-rest, run: "cargo test --no-run --locked --profile ci --workspace --exclude polykrom-engine --exclude polykrom-ui-egui" }
          - { key: doc-tests, run: "cargo test --locked --profile ci --doc --workspace" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.key == 'checks' && 'rustfmt, clippy' || '' }}
          targets: ${{ matrix.key == 'checks' && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.key }}
      - name: Build
        env:
          RUN: ${{ matrix.run }}
        run: bash -c "$RUN"

  site:
    name: Site viewer tests
    if: github.repository == 'WCKDai/polykrom'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hashFiles is not available in a job's `if`: the steps skip when the site is not in the tree.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: hashFiles('site/tests/viewer_test.ts') != ''
        with:
          deno-version: v2.x
      - name: Viewer kinematics and mesh packs
        if: hashFiles('site/tests/viewer_test.ts') != ''
        run: |
          fixture="$RUNNER_TEMP/viewer-fixture"
          python3 site/tests/fixture.py "$fixture"
          python3 site/meshpack.py "$fixture" "$fixture/pack.bin" "$fixture/pack.json"
          FIXTURE="$fixture" deno test -A --import-map=site/tests/import_map.json site/tests/viewer_test.ts
