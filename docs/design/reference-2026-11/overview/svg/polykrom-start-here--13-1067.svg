<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="40" font-weight="bold" letter-spacing="0em"><tspan x="132" y="102.545">POLYKROM</tspan></text>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="28" font-weight="500" letter-spacing="0em"><tspan x="48" y="181.682">Mechanical CAD. Native AI.</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="231.818">An open-source modelling studio by WCKD, powered by PolyCore.&#10;</tspan><tspan x="48" y="253.818">First design direction / editable vectors, text and component instances.</tspan></text>
<rect width="1024" height="74" transform="translate(48 283)" fill="#292C2F"/>
<rect width="900" height="54" transform="translate(68 293)" fill="#292C2F"/>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" font-weight="500" letter-spacing="0em"><tspan x="68" y="309.818">01 / Brand &#38; identity</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="68" y="331.864">Exact supplied mark, electric lime gradient and WCKD family styling.</tspan></text>
<text fill="#E0FF30" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" letter-spacing="0em"><tspan x="984" y="328.727">&#x2197;</tspan></text>
<rect width="1024" height="74" transform="translate(48 381)" fill="#292C2F"/>
<rect width="900" height="54" transform="translate(68 391)" fill="#292C2F"/>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" font-weight="500" letter-spacing="0em"><tspan x="68" y="407.818">02 / Parametric modelling</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="68" y="429.864">Sketches, features, bodies, properties and design history.</tspan></text>
<text fill="#E0FF30" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" letter-spacing="0em"><tspan x="984" y="426.727">&#x2197;</tspan></text>
<rect width="1024" height="74" transform="translate(48 479)" fill="#292C2F"/>
<rect width="900" height="54" transform="translate(68 489)" fill="#292C2F"/>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" font-weight="500" letter-spacing="0em"><tspan x="68" y="505.818">03 / Constrained sketch</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="68" y="527.864">A fully constrained 84 &#xd7; 44 mounting pattern.</tspan></text>
<text fill="#E0FF30" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" letter-spacing="0em"><tspan x="984" y="524.727">&#x2197;</tspan></text>
<rect width="1024" height="74" transform="translate(48 577)" fill="#292C2F"/>
<rect width="900" height="54" transform="translate(68 587)" fill="#292C2F"/>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" font-weight="500" letter-spacing="0em"><tspan x="68" y="603.818">04 / Edit a feature</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="68" y="625.864">Change the mounting holes from &#xd8;8 to &#xd8;10 and preview the result.</tspan></text>
<text fill="#E0FF30" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" letter-spacing="0em"><tspan x="984" y="622.727">&#x2197;</tspan></text>
<rect width="1024" height="74" transform="translate(48 675)" fill="#292C2F"/>
<rect width="900" height="54" transform="translate(68 685)" fill="#292C2F"/>
<text fill="#ECEEF0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" font-weight="500" letter-spacing="0em"><tspan x="68" y="701.818">05 / Native AI review</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="68" y="723.864">A model command proposes the same change. Review, apply and undo.</tspan></text>
<text fill="#E0FF30" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" letter-spacing="0em"><tspan x="984" y="720.727">&#x2197;</tspan></text>
<text fill="#A9B0B7" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="48" y="785.864">PROTOTYPE / Model: choose Sketch, Edit feature, or the model command bar.&#10;</tspan><tspan x="48" y="802.864">AI: Apply &#38; rebuild &#x2192; Model updated &#x2192; Undo.</tspan></text>
