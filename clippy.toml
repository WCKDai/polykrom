allow-indexing-slicing-in-tests = true

# A design gives the same bits on every platform (PK-98). PolyCore (PC-12) computes every
# transcendental through `pmath` (`polycore_geom::pmath`, `polykrom_engine::geom::pmath` above the
# engine), correctly rounded from IEEE 754 arithmetic alone, because the platforms' libm disagree
# (macOS rounds `sin(2π/3)` an ULP off glibc). The sketch arcs, patterns and transforms Polykrom's
# own crates build feed that kernel, so they go through `pmath` too: this is PolyCore's
# `disallowed-methods` list (its clippy.toml at the pinned revision; `pmath_gate` in
# crates/engine/tests checks that it is still a superset, that a planted call fails, and that the
# UI-only code allowed to keep the platform's functions is exactly its allow-list). `sqrt`, `powi`
# (compiler-rt's square-and-multiply on every target), `abs`, `floor`, `round`, `to_radians` and
# the arithmetic are the same everywhere and stay; `mul_add` is fused or not by hardware and is
# banned too. The entries for crates Polykrom's own crates do not depend on (spade, cgmath,
# num-traits, libm) are `allow-invalid`, so a crate without them still lints.
